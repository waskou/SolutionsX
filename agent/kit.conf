# agent/kit.conf -- the agent kit's configuration (EXPERIMENTAL).
#
# Flat KEY=VALUE, integers only, no quoting. This file is PARSED (grep),
# never sourced -- a malformed line is ignored and `sxk config` warns
# about it, it cannot execute anything.
#
# Precedence, highest first:
#   1. `sxk set <KEY> <value>`  -- session-only, dies with the session dir;
#                                  surfaced to the agent like a user note
#                                  until `sxk ack`
#   2. environment SXK_<KEY>    -- for scripted / one-shot runs
#   3. this file                -- the owner's standing preferences (edit it)
#   4. built-in defaults in sxk -- the fallback if this file is absent
# `sxk config` prints every effective value and where it came from.
#
# Two kinds of lever, marked on each entry:
#   [enforced] sxk itself acts on the value -- changing it changes behavior.
#   [advisory] sxk only DISPLAYS the value; the agent is instructed
#              (LADDER.md) to act on it. Nothing can force an agent to
#              comply -- by design (reporter, not gatekeeper).

# ---------------------------------------------------------------- budgets

# [enforced] Default TimeConstrained budget, in seconds, for `sxk try`
# when no explicit budget is given (`sxk try 300 '...'` always wins).
# On expiry the expression is cut off but the kernel and all its state
# SURVIVE, and the agent is pointed at the hints -- that is the whole
# point of try: a wrong-shaped attempt costs TRY_SECONDS, not a silent
# half-hour. Lower it to make attempts cheaper; raise it only for steps
# you have reason to believe are legitimately slow.
TRY_SECONDS=120

# [enforced] How long `sxk do` blocks, in seconds, before giving up the
# wait and returning control (exit 2, with a pointer to watch/stop/again).
# The submission KEEPS RUNNING in the kernel -- this lever decides when
# the agent gets its prompt back, not when the kernel stops. Raise it if
# legitimate single cells run longer than 10 minutes; lower it to force
# the agent onto bg+watch for anything slow.
DO_TIMEOUT=600

# [enforced] Default polling interval, in seconds, of `sxk watch` (an
# explicit `sxk watch 2 ...` wins). Each poll prints new transcript
# output and, when the Compute channel is on, the compute pulse. Smaller
# = tighter observation, more output; larger = quieter logs.
WATCH_INTERVAL=5

# [enforced] Default total watch time, in seconds, before `sxk watch`
# exits 2 (still BUSY). A watch that ends is a decision point, not an
# abort -- the computation continues; the agent must consciously choose
# to keep waiting, consult the hints, or stop.
WATCH_MAX=600

# [enforced] Default timeout, in seconds, of `sxk wait` (blocking until
# the kernel is idle). The backstop for "load + Compute once" phases that
# are expected to be long but bounded.
WAIT_MAX=3600

# ---------------------------------------------------- the stall ladder

# [advisory] How many DISTINCT failed shapes on ONE obstacle before the
# agent must stop spending and write STALLED.md (LADDER.md defines what
# counts as a "shape": a structurally different approach -- different
# substrate, method, or decomposition -- not a retry or a parameter
# tweak). Lower it for cheap-to-interrupt exploratory sessions; raise it
# only when you have told the agent to grind.
STALL_SHAPES=3

# [advisory+enforced display] How many minutes WITHOUT A NEW VERIFIED
# FACT before the agent must stop spending and write STALLED.md
# (LADDER.md defines "verified fact": a check that actually ran and
# returned a definitive answer -- progress is measured in facts, not in
# effort). sxk also uses it mechanically in one place: when a busy
# kernel's compute pulse is older than this, status/watch FLAG the pulse
# as stale -- a report, not a verdict; slow single components can be
# legitimate. This is the lever to turn down mid-campaign (sxk set
# STALL_MINUTES 10) when you watch an agent circling.
STALL_MINUTES=30
